<div class="modal-backdrop">
  <div class="confirm-modal">
    <h3 class="confirm-title">¿Estás seguro?</h3>
    <p class="confirm-message">¿Realmente deseas eliminar este registro? Esta acción no se puede deshacer.</p>
    
    <div class="confirm-actions">
      <button class="btn cancel-btn" (click)="onCancel()">Cancelar</button>
      <button class="btn confirm-btn" (click)="onConfirm()">Aceptar</button>
    </div>
  </div>
</div>

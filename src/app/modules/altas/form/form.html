<div class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Gestionar Producto</h2>
      <button type="button" class="close-modal-btn" aria-label="Cerrar modal" (click)="onCancel()">&times;</button>
    </div>

    <form class="product-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="modal-body">
          <div class="form-row">
              <div class="form-group">
                  <label for="product-name">Nombre del Producto</label>
                  <input type="text" id="product-name" formControlName="name">
                  <div class="error-message" *ngIf="productForm['name'].invalid && (productForm['name'].dirty || productForm['name'].touched)">
                    <span *ngIf="productForm['name'].errors?.['required']">Este campo es requerido.</span>
                  </div>
              </div>
              <div class="form-group">
                  <label for="description">Descripción</label>
                  <input type="text" id="description" formControlName="description">
                  <div class="error-message" *ngIf="productForm['description'].invalid && (productForm['description'].dirty || productForm['description'].touched)">
                    <span *ngIf="productForm['description'].errors?.['required']">La descripción es requerida.</span>
                  </div>
              </div>
              
          </div>

          <div class="form-row">
              <div class="form-group">
                  <label for="product-price">Precio de Venta</label>
                  <input type="number" id="product-price"  placeholder="0.00" step="0.01" min="0" formControlName="price">
                  <div class="error-message" *ngIf="productForm['price'].invalid && (productForm['price'].dirty || productForm['price'].touched)">
                    <span *ngIf="productForm['price'].errors?.['required']">El precio es requerido.</span>
                  </div>
              </div>
              <div class="form-group">
                  <label for="product-stock">Stock Disponible</label>
                  <input type="number" id="product-stock"  placeholder="0" min="0" formControlName="stock">
                  <div class="error-message" *ngIf="productForm['stock'].invalid && (productForm['stock'].dirty || productForm['stock'].touched)">
                    <span *ngIf="productForm['stock'].errors?.['required']">El stock es requerido.</span>
                  </div>
              </div>
          </div>

          <div class="form-row">
              <div class="form-group">
                  <label for="product-category">Categoría</label>
                  <select id="product-category" formControlName="category">
                      <option value="">Seleccione una categoría</option>
                      <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
                  </select>
                  <div class="error-message" *ngIf="productForm['category'].invalid && (productForm['category'].dirty || productForm['category'].touched)">
                    <span *ngIf="productForm['category'].errors?.['required']">La categoría es requerida.</span>
                  </div>
              </div>
              <div class="form-group">
                  <label for="product-image">URL de Imagen</label>
                  <input type="text" id="product-image" formControlName="image_url">
                  <div class="error-message" *ngIf="productForm['image_url'].invalid && (productForm['image_url'].dirty || productForm['image_url'].touched)">
                    <span *ngIf="productForm['image_url'].errors?.['required']">La URL de imagen es requerida.</span>
                  </div>
              </div>
          </div>  

          <div class="form-row">
            <div class="form-group-toggle">
              <label for="product-active">Estado del Producto</label>
              <label class="toggle-switch">
                <input type="checkbox" id="product-active" formControlName="is_active">
                <span class="slider"></span>
              </label>
            </div>
          </div>
      </div>
      <div class="modal-footer">
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" (click)="onCancel()">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
               Registrar Producto
            </button>
        </div> 
      </div>
    </form>
  </div>
</div>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Iniciar Sesión</h2>
            <p>Accede a la plataforma de gestión del carrito de compras</p>
        </div>
        
        <form class="login-form" (ngSubmit) = "login()" #forma="ngForm">
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input [(ngModel)]="authModel.username" type="input" #username = "ngModel" id="username" name="username" required minlength="3" maxlength="10">
                
                <div class="invalid-feedback" *ngIf="username.invalid && (username.dirty || username.touched)">
                    <span *ngIf="username?.errors?.['minlength']">Este campo debe tener al menos 3 caracteres</span>
                    <span *ngIf="username?.errors?.['maxlength']">Este campo debe tener como máximo 10 caracteres</span>
                    <span *ngIf="username?.errors?.['required']">Este campo es requerido</span>
                </div>
                
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input [(ngModel)]="authModel.password" type="password" #password = "ngModel" id="password" name="password" required>

                <div class="invalid-feedback" *ngIf="password.invalid && (password.dirty || password.touched)">
                    <span *ngIf="password?.errors?.['required']">Este campo es requerido</span>
                </div>

            </div>
            
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Recordarme
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit" class="login-btn" [disabled]="!forma.valid">
                Iniciar Sesión
            </button>
        </form>
        
        <div class="login-footer">
            <p>¿No tienes cuenta? <a href="#" class="signup-link">Regístrate aquí</a></p>
        </div>
    </div>
</div>

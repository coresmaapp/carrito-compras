<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Iniciar Sesión</h2>
            <p>Accede a la plataforma de gestión del carrito de compras</p>
        </div>
        
        <form class="login-form" (ngSubmit) = "login()" [formGroup]="userForm">
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input formControlName="username" type="input">
                
                <div class="invalid-feedback" *ngIf="form['username'].invalid && (form['username'].dirty || form['username'].touched)">
                    <span *ngIf="form['username'].errors?.['minlength']">Este campo debe tener al menos 3 caracteres</span>
                    <span *ngIf="form['username'].errors?.['maxlength']">Este campo debe tener como máximo 10 caracteres</span>
                    <span *ngIf="form['username'].errors?.['required']">Este campo es requerido</span>
                </div>
                
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input formControlName="password" type="password">

                <div class="invalid-feedback" *ngIf="form['password'].invalid && (form['password'].dirty || form['password'].touched)">
                    <span *ngIf="form['password'].errors?.['required']">Este campo es requerido</span>
                </div>

            </div>
            
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Recordarme
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
            
            <!-- Bloque para mostrar el error de inicio de sesión -->
            <div *ngIf="loginError" class="login-error-feedback">
                {{ loginError }}
            </div>

            <button type="submit" class="login-btn" [disabled]="userForm.invalid">
                Iniciar Sesión
            </button>
        </form>
        
        <div class="login-footer">
            <p>¿No tienes cuenta? <a href="#" class="signup-link">Regístrate aquí</a></p>
        </div>
    </div>
</div>

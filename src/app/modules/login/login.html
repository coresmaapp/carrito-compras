<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Iniciar Sesión</h2>
            <p>Accede a la plataforma de gestión del carrito de compras</p>
        </div>
        
        <form class="login-form" (ngSubmit) = "login()">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input [(ngModel)]="username" type="input" id="email" name="username" placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input [(ngModel)]="password" type="password" id="password" name="password" placeholder="••••••••">
            </div>
            
            <div class="form-options">
                <label class="checkbox-container">
                    <input type="checkbox" name="remember">
                    <span class="checkmark"></span>
                    Recordarme
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit" class="login-btn" >
                Iniciar Sesión
            </button>
        </form>
        
        <div class="login-footer">
            <p>¿No tienes cuenta? <a href="#" class="signup-link">Regístrate aquí</a></p>
        </div>
    </div>
</div>

<header class="header">
    <div class="header-content">
        <div class="logo">
            <h1>🛒 Carrito de Compras</h1>
        </div>
        <nav class="nav-menu">
            <a routerLink="/productos" routerLinkActive="active" class="nav-link">Productos</a>
            <a routerLink="/compras" routerLinkActive="active" class="nav-link">Compras</a>
            <a routerLink="/ventas" routerLinkActive="active" class="nav-link">Ventas</a>
            <a routerLink="/alta" routerLinkActive="active" class="nav-link">Altas</a>

            @if (isLoggedIn) {
                <a (click)="logout()" routerLinkActive="active" routerLinkActive="active" class="nav-link">Logout</a>
            } @else {
                <a routerLink="/login" routerLinkActive="active" class="nav-link">Login</a>
            }

        </nav>
    </div>
</header>
